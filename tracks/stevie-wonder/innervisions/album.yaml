title: Innervisions
artist: Stevie Wonder
year: 1973
label: Tamla / Motown
studios:
  - Record Plant (Los Angeles)
  - Media Sound (New York)
producers:
  - Stevie Wonder
  - Malcolm Cecil (Associate)
  - Robert Margouleff (Associate)
key_gear:
  - TONTO Modular Synthesizer
  - ARP 2600
  - Moog Bass
  - Hohner Clavinet D6 with Mu-Tron III
  - Ludwig Drum Kit
  - Fender Rhodes
personnel:
  Stevie Wonder: All instruments and vocals (on Higher Ground and Living for the City)
  Malcolm Cecil: TONTO programming and engineering
  Robert Margouleff: TONTO programming and engineering
description: >
  Widely considered Stevie Wonder's masterpiece. Stevie played virtually every instrument on key tracks,
  displaying virtuosic polyrhythmic groove mastery and pioneering synthesizer orchestration.
